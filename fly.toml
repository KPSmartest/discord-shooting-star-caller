# fly.toml for the Discord reminder bot.
# The Fly app is still named "discord-shooting-star-caller" so we reuse the existing
# app, secrets, and CI token. Rename with `fly apps create` + a new volume if you prefer.

app = "discord-shooting-star-caller"
primary_region = "syd" # Sydney — closest region to NZ. The volume must live in this region.

kill_signal = "SIGINT"
kill_timeout = 5

# Build from the Dockerfile (more reliable on Fly's remote builder than classic buildpacks).

[env]
  PORT = "8080"
  DATABASE_PATH = "/data/reminders.db"
  TIMEZONE = "Pacific/Auckland"
  # Non-secret identifiers / public key. The bot token is NOT here — it is the only real
  # secret and is set with `fly secrets set DISCORD_BOT_TOKEN=...`.
  APPLICATION_ID = "1524944515469807616"
  GUILD_ID = "971306416260411403"
  DISCORD_PUBLIC_KEY = "d516c53d6dea9b013d9a4c1d28b916e7eda00da5979ded5c4bac576bcd45ad91"

# SQLite lives on a persistent volume. Create it once with:
#   fly volumes create reminder_data --size 1 --region syd
[mounts]
  source = "reminder_data"
  destination = "/data"

# Always-on single machine: the in-process scheduler must keep running to fire reminders,
# so we never auto-stop. Single machine only (SQLite is bound to one volume).
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = false
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
